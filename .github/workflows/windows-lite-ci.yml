name: Windows Lite CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-lite-ci.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'EngineerLite.sln'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-lite-ci.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'EngineerLite.sln'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64
      - name: Test core and build WinUI
        shell: pwsh
        run: ./scripts/build-windows-lite.ps1 -Configuration Release -Portable
      - name: Verify launcher and login screen
        shell: powershell
        run: ./scripts/test-windows-startup.ps1
      - name: Verify workspace with synthetic API
        shell: powershell
        run: ./scripts/test-windows-workspace.ps1
      - name: Upload application ZIP
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EngineerLite-Windows-x64
          path: artifacts/portable/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-lite-diagnostics-${{ github.run_number }}
          path: |
            artifacts/*.binlog
            artifacts/tests/
          if-no-files-found: warn
          retention-days: 7
